name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
  # Atualiza a lateral de vídeos (fetch_videos.py) uma vez por hora.
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Sem isto, 3 pushes rápidos (upload de áudio → gravar songs.js → bump de
# cache) chegam quase juntos no passo "Deploy to GitHub Pages", e o 2º/3º
# recebem um erro 400 da própria API de Pages porque o anterior ainda está
# "in progress" lá — ela não enfileira sozinha, só rejeita.
# cancel-in-progress:false enfileira sem interromper um deploy em andamento;
# o GitHub, por conta própria, já descarta runs mais antigos que ainda
# estejam só na fila (não rodando) quando um mais novo chega — então o build
# final de cada leva de commits sempre reflete o estado completo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate song pages
        run: python generate_song_pages.py

      - name: Fetch latest YouTube videos
        run: python fetch_videos.py

      # O Supabase grátis pausa o projeto depois de 7 dias sem acesso; esta
      # consulta de hora em hora (devolve lista vazia, pelas regras RLS) evita isso.
      - name: Keep Supabase awake
        continue-on-error: true
        run: |
          URL=$(grep -oP "url:\s*'\K[^']+" supabase-config.js || true)
          KEY=$(grep -oP "key:\s*'\K[^']+" supabase-config.js || true)
          if [ -n "$URL" ] && [ -n "$KEY" ]; then
            curl -fsS -o /dev/null -w "supabase: %{http_code}\n" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$URL/rest/v1/correcoes?select=id&limit=1"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
